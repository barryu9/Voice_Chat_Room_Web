services:
  nginx:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    container_name: vc-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/frontend-only.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/localtime:/etc/localtime:ro
