services:
  mongo:
    image: mongo:7.0
    container_name: vc-mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MONGO_PORT}:27017"
    volumes:
      - mongo-data:/data/db
      - /etc/localtime:/etc/localtime:ro
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME}
    networks:
      - vc-network

  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    container_name: vc-backend
    restart: unless-stopped
    network_mode: "host"
    volumes:
      - /etc/localtime:/etc/localtime:ro
    environment:
      NODE_ENV: production
      PORT: ${BACKEND_PORT}
      HOST: ${BACKEND_HOST}
      MONGODB_URI: mongodb://127.0.0.1:${MONGO_PORT}/${MONGO_DB_NAME}
      MEDIASOUP_LISTEN_IP: ${MEDIASOUP_LISTEN_IP}
      MEDIASOUP_ANNOUNCED_IP: ${PUBLIC_IP}
      MEDIASOUP_RTC_MIN_PORT: ${RTC_MIN_PORT}
      MEDIASOUP_RTC_MAX_PORT: ${RTC_MAX_PORT}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      CORS_ORIGIN: ${CORS_ORIGIN}
    depends_on:
      - mongo

  nginx:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    container_name: vc-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NGINX_PORT}:80"
    volumes:
      - /etc/localtime:/etc/localtime:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend
    networks:
      - vc-network

volumes:
  mongo-data:

networks:
  vc-network:
    driver: bridge
